<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatame de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: uma coluna calma (máx. 720px), alinhada à esquerda, com muito respiro. Branco e dourado, como as legendas do Byel.
     O dourado marca só o que importa: o título, a ação principal e o progresso. */
  --bg:#FDFCF9;
  --surface:#F6F3EB;
  --ink:#24221D;
  --muted:#7A7467;
  --line:#E7E2D5;
  --gold:#C29A3E;
  --gold-text:#8E6A1B;
  --gold-soft:#F2E8CE;
  --on-gold:#221E15;
  --bad:#A3443A;
  --good:#4E7A49;
  --b0:#EFEBE0; --b1:#6A86B8; --b2:#8E77B3; --b3:#2B2925;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140F; --surface:#1E1C17; --ink:#F4F1E8; --muted:#A9A294; --line:#2E2B24;
    --gold:#D9B45F; --gold-text:#E2BF6C; --gold-soft:#2C2616; --on-gold:#1A1712;
    --bad:#E3897D; --good:#93C38B; --b0:#F1EDE2; --b3:#08080A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15140F; --surface:#1E1C17; --ink:#F4F1E8; --muted:#A9A294; --line:#2E2B24;
  --gold:#D9B45F; --gold-text:#E2BF6C; --gold-soft:#2C2616; --on-gold:#1A1712;
  --bad:#E3897D; --good:#93C38B; --b0:#F1EDE2; --b3:#08080A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(32px,8vw,44px);font-weight:800;line-height:1.1;color:var(--gold-text)}
h2{font-size:20px;font-weight:700;line-height:1.3}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* Topo */
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;text-decoration:none;letter-spacing:-.01em}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.track-pick{margin-left:auto;display:flex;min-width:0;flex:0 1 auto}
.track-pick select{max-width:100%;min-width:0;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 34px 8px 14px;font-weight:600;font-size:14px;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.top-btn{background:transparent;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:8px 6px;cursor:pointer}
.top-btn:hover{color:var(--ink)}
@media (max-width:599px){.hide-sm{display:none}.track-pick{flex:1;justify-content:flex-end}}

/* Navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line)}
.tabs ul{list-style:none;margin:0 auto;padding:0 8px;max-width:720px;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:block;text-align:center;text-decoration:none;font-size:13px;font-weight:600;color:var(--muted);padding:14px 2px 16px;position:relative}
.tabs a[aria-current="page"]{color:var(--gold-text)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;left:50%;top:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
@media (min-width:760px){
  .tabs{position:static;border:0;background:transparent}
  .tabs ul{display:flex;gap:6px;padding:14px 20px 0}
  .tabs a{padding:8px 14px;font-size:14.5px;border-radius:999px}
  .tabs a[aria-current="page"]{background:var(--gold-soft)}
  .tabs a[aria-current="page"]::before{display:none}
}
main{padding:36px 0 130px}
@media (min-width:760px){main{padding:56px 0 80px}}
.view{display:flex;flex-direction:column;gap:52px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer;line-height:1.2;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn-gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn-gold:hover{border-color:var(--gold);filter:brightness(1.04)}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-text{background:transparent;border:0;padding:6px 2px;color:var(--muted);border-radius:6px;font-weight:600;font-size:14.5px;cursor:pointer}
.btn-text:hover{color:var(--ink)}
.btn-text.danger{color:var(--bad)}
.btn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad);padding:7px 14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* Faixa: um ponto colorido + nome, e 4 passos de nível em dourado */
.beltchip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--b0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.dot[data-b="1"]{background:var(--b1)} .dot[data-b="2"]{background:var(--b2)} .dot[data-b="3"]{background:var(--b3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.levels i{display:block;height:4px;border-radius:2px;background:var(--line)}
.levels i.on{background:var(--gold)}
.levels-labeled{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levels-labeled div{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.levels-labeled div i{display:block;height:5px;border-radius:3px;background:var(--line)}
.levels-labeled div.on i{background:var(--gold)}
.levels-labeled div.now{color:var(--ink);font-weight:700}

/* Hoje */
.example{font-size:14.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.example .btn-text{color:var(--gold-text);font-weight:700}
.hero{display:flex;flex-direction:column;gap:14px}
.hero .goal{font-size:18px;max-width:52ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:14.5px}
.belt-sum{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.belt-sum li{display:flex;flex-direction:column;gap:6px}
.belt-sum .beltchip{color:var(--muted);font-weight:500}
.belt-sum strong{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:420px){.belt-sum{grid-template-columns:repeat(2,1fr);row-gap:20px}}

.panel{background:var(--surface);border-radius:20px;padding:26px}
.train{display:flex;flex-direction:column;gap:18px}
.train h2{color:var(--gold-text)}
.train p{color:var(--muted);max-width:54ch}
.train .after{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.train .after span{color:var(--muted);font-size:14.5px}

.block{display:flex;flex-direction:column;gap:18px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.block-head .note{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);padding:4px 0;max-width:56ch}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
button.item:hover{background:var(--gold-soft)}
.item-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.t-name{font-weight:700;font-size:16.5px}
.when{font-size:14px;color:var(--muted)}
.when.late,.when.now{color:var(--gold-text);font-weight:700}
.item .sub{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}

/* Linha */
.day{display:flex;flex-direction:column;gap:12px}
.day h3{font-size:14px;color:var(--muted);font-weight:600}
.s-item{background:var(--surface);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.s-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.s-note{font-size:14.5px;color:var(--muted)}
.change{font-weight:700;color:var(--gold-text)}
.change.down{color:var(--bad)}

/* Páginas */
.page-head{display:flex;flex-direction:column;gap:14px}
.lede{font-size:17px;max-width:56ch;color:var(--muted)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.legend li{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:baseline}
.legend p{color:var(--muted);font-size:15px}
@media (max-width:420px){.legend li{grid-template-columns:1fr;gap:4px}}

/* Caderno */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--gold-text)}
.filters{display:flex;flex-wrap:wrap;gap:12px}
.filters select,.filters input{flex:1 1 200px;min-width:0;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.note-card{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.note-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13.5px;color:var(--muted)}
.kind{font-weight:700;color:var(--gold-text)}
.kind.erro{color:var(--bad)}
.note-title{font-weight:700;font-size:16.5px}
.note-text{white-space:pre-wrap;max-width:62ch}
.note-card dl{margin:0;display:grid;grid-template-columns:80px 1fr;gap:6px 14px;font-size:15px}
.note-card dt{color:var(--muted);font-weight:600;font-size:14px}
.note-card dd{margin:0}
.note-card.done{opacity:.6}
.flag{font-size:13px;font-weight:700;color:var(--gold-text)}

/* Prompt */
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px;max-width:58ch}
.steps li::marker{font-weight:700;color:var(--gold-text)}
pre{margin:0;white-space:pre-wrap;word-wrap:break-word;background:var(--surface);border-radius:16px;padding:22px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.65;max-height:62vh;overflow:auto}

/* Janelas e formulários */
dialog{border:0;border-radius:22px;background:var(--bg);color:var(--ink);padding:0;width:min(560px,calc(100% - 24px));max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(20,18,12,.45)}
.form{display:flex;flex-direction:column;gap:18px;padding:28px 24px}
.form h2{font-size:22px;color:var(--gold-text)}
.form-sub{color:var(--muted);font-size:14.5px;margin-top:-10px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.seg legend{font-size:14px;font-weight:600}
.form input[type=text],.form input[type=number],.form input[type=date],.form select,.form textarea{width:100%;background:var(--surface);border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:15.5px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--gold);outline:none}
.form textarea{resize:vertical;line-height:1.5}
.hint{font-size:13.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.seg{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.seg legend{padding:0;margin-bottom:8px}
.seg .opts{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:600;color:var(--muted)}
.seg input:checked + span{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--gold-text)}
.seg input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--gold)}
details{background:var(--surface);border-radius:12px;padding:12px 14px}
details summary{cursor:pointer;font-weight:600;font-size:14.5px}
details[open] summary{margin-bottom:12px}
.err-rows{display:flex;flex-direction:column;gap:14px}
.err-row{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:14px;padding:14px}
.err-row label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.err-row label.check{flex-direction:row;font-weight:500}
.err-row input[type=text],.err-row textarea{background:var(--bg)!important}
.form-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;align-items:center;padding-top:6px}
.form-actions .spacer{flex:1}
.form-error{color:var(--bad);font-size:14px;font-weight:600}
.facts{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mini li{font-size:14.5px;padding-left:12px;border-left:2px solid var(--gold-soft)}
.mini .k{color:var(--gold-text);font-weight:700;margin-right:6px}
.sec{display:flex;flex-direction:column;gap:14px;padding-top:22px;border-top:1px solid var(--line)}
.store-note{font-size:14.5px;color:var(--muted)}

/* Aviso */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-weight:600;font-size:14.5px;max-width:min(520px,calc(100% - 32px));text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.up{background:var(--gold);color:var(--on-gold)}
@media (min-width:760px){.toast{bottom:32px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#hoje" aria-label="Tatame, ir para Hoje"><i aria-hidden="true"></i>Tatame</a>
    <label class="track-pick"><span class="sr">Trilha de estudo</span><select id="trackSelect"></select></label>
    <button class="top-btn hide-sm" type="button" data-action="new-track">Nova trilha</button>
    <button class="top-btn" type="button" data-action="settings">Ajustes</button>
  </div>
</header>
<nav class="tabs" aria-label="Seções">
  <ul>
    <li><a href="#hoje" data-view="hoje">Hoje</a></li>
    <li><a href="#faixas" data-view="faixas">Faixas</a></li>
    <li><a href="#caderno" data-view="caderno">Caderno</a></li>
    <li><a href="#linha" data-view="linha">Linha</a></li>
    <li><a href="#prompt" data-view="prompt">Prompt</a></li>
  </ul>
</nav>
<main class="wrap"><div id="view" class="view"></div></main>
<dialog id="dlg" aria-label="Janela"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- O prompt (versão 2.1) ---------- */
const PROMPT = `# QUEM VOCÊ É
Você é um professor particular de elite. Domina profundamente o assunto que eu escolher e domina a ciência da aprendizagem. Sua missão é me levar do nível em que estou até o domínio real, no menor tempo possível, dentro do tempo e da energia que eu realmente tenho.

Você age como um treinador exigente: cobra, corrige na hora e não aceita atalho. Nunca humilha. Elogio só quando é merecido e específico.

# O MÉTODO QUE VOCÊ SEGUE
Aplique estes princípios sem me dar aula sobre eles:
1. Aprendizagem para o domínio (Benjamin Bloom): eu só avanço quando dominar a etapa atual.
2. Taxonomia de Bloom: suas perguntas sobem de nível: lembrar → entender → aplicar → analisar → avaliar → criar.
3. Zona de desenvolvimento proximal: o desafio deve ser difícil, mas possível. Se eu acertar tudo com facilidade, aumente a dificuldade. Se eu errar quase tudo, volte um passo.
4. Andaime: no começo de um assunto, mostre um exemplo resolvido passo a passo; depois, me dê um exemplo pela metade para eu completar; depois, problemas sozinho. Retire a ajuda aos poucos.
5. Prática de recuperação: eu sempre tento lembrar antes de ver qualquer resposta.
6. Prática espaçada: o que eu aprendo volta em revisões com intervalos cada vez maiores.
7. Prática intercalada: misture tópicos antigos com os novos.
8. Autoexplicação: eu explico com minhas palavras e você aponta as lacunas.
9. Feedback imediato e específico: o que errei, por que errei e como pensar certo.
10. Calibração: nas perguntas de checagem, eu digo antes de responder quanto tenho de certeza (0 a 100%). Use isso para mostrar onde eu acho que sei, mas não sei.

# AS FAIXAS
Cada tópico do plano tem 4 faixas, e eu subo uma de cada vez:
- Branca (Lembrar): reconheço e defino os conceitos básicos.
- Azul (Entender): explico com minhas palavras e dou exemplos próprios.
- Roxa (Aplicar): resolvo sozinho exercícios que nunca vi.
- Preta (Dominar): resolvo questões de nível de prova, encontro erros, comparo caminhos e consigo ensinar.
Promoção: só subo de faixa se acertar pelo menos 80% de uma checagem sem consulta, feita em um dia diferente do dia em que aprendi.
Rebaixamento: se eu ficar abaixo de 60% numa revisão, desço uma faixa naquele tópico e reforçamos.

# COMO ENSINAR POR FAIXAS
Você ensina cada tópico faixa por faixa. Em toda sessão:
1. Comece dizendo o tópico, a minha faixa atual nele e o objetivo de hoje.
2. Ensine e pratique no nível da faixa atual. Nunca pule faixa.
3. A checagem do fim é no nível da próxima faixa: é ela que decide se eu subo. Diga a minha % de acertos.
O que muda em cada faixa:
- Branca: definições, vocabulário e exemplos resolvidos. Perguntas de lembrar e reconhecer.
- Azul: eu explico com minhas palavras, comparo conceitos, crio exemplos e acho erros em exemplos simples.
- Roxa: exercícios novos, problemas com contexto e questões no estilo da prova, misturando tópicos.
- Preta: questões difíceis de prova, pegadinhas, encontrar e corrigir erros, comparar soluções e ensinar o tema para você.

# MEU CADERNO
Se eu colar meu caderno (aprendizados, anotações, dúvidas e erros), use como contexto do que eu já estudei: retome as dúvidas em aberto, ataque os erros que se repetem e não repita o que eu já domino.

# COMO COMEÇAMOS
1. Me entreviste, uma pergunta por vez:
   - O que eu quero aprender?
   - Para quê (prova, concurso, emprego, projeto) e qual é o prazo?
   - Quanto tempo real eu tenho por dia, em que horário e em que condições (trabalho, cansaço, barulho)?
   - Que materiais eu tenho ou consigo de graça?
2. Faça um teste diagnóstico curto (5 a 8 perguntas, da mais fácil para a mais difícil) para descobrir meu nível real, não o que eu acho que sei.
3. Entregue:
   - O MAPA: os tópicos em ordem, começando pelo que mais cai ou mais importa para o meu objetivo, com a minha faixa atual em cada um.
   - O PLANO: o que fazer em cada semana até o prazo, cabendo no meu tempo real.

# CADA SESSÃO
1. Revisão de abertura: perguntas sobre as revisões agendadas e a sessão anterior. Sem consulta.
2. Conteúdo novo: o mínimo de teoria, no nível da faixa atual, + um exemplo resolvido.
3. Prática: exemplo para completar → problemas sozinho, misturados com tópicos antigos.

function applySession(tp, s){
  const before = tp.belt;
  let after = before;
  if (s.check != null){
    if (s.check >= 80 && s.date > tp.beltSince && before < 3) after = before + 1;
    else if (s.check < 60 && before > 0) after = before - 1;
    tp.lastCheck = s.check;
  }
  if (after !== before){ tp.belt = after; tp.beltSince = s.date; tp.stripes = 0; }
  else { tp.stripes = Math.min(99, (tp.stripes || 0) + 1); }
  if (s.kind === 'novo'){ tp.reviewStage = 0; }
  else if (s.check != null){
    if (s.check >= 80) tp.reviewStage = Math.min((tp.reviewStage || 0) + 1, INTERVALS.length - 1);
    else if (s.check < 60) tp.reviewStage = 0;
  }
  tp.nextReview = addDays(s.date, INTERVALS[tp.reviewStage || 0]);
  return {before: before, after: after};
}
function reviewInfo(tp){
  if (!tp.nextReview) return {text:'Sem revisão marcada', cls:''};
  const d = diffDays(today(), tp.nextReview);
  if (d === 0) return {text:'Revisar hoje', cls:'now'};
  if (d < 0) return {text:'Atrasada há ' + plural(-d, 'dia', 'dias'), cls:'late'};
  if (d === 1) return {text:'Revisão amanhã', cls:''};
  return {text:'Revisão em ' + plural(d, 'dia', 'dias'), cls:''};
}

function normalize(d){
  if (!d || typeof d !== 'object' || !Array.isArray(d.tracks)) return null;

  s.topics = arr(d.topics).map(x => Object.assign({belt:0, stripes:0, lastCheck:null, reviewStage:0, nextReview:null, beltSince:today()}, x));
  s.sessions = arr(d.sessions);
  s.notes = arr(d.notes).map(x => newNote(x.trackId, x.topicId, KINDS[x.type] ? x.type : 'anotacao', x));

  arr(d.errors).forEach(e => s.notes.push(newNote(e.trackId, e.topicId, 'erro', {id:e.id, text:e.what || '', why:e.why || '', right:e.right || '', sure:!!e.sure, resolved:!!e.resolved, date:e.date || today(), updatedAt:e.date || today()})));
  s.topics.forEach(tp => {

const store = {mode:'memory', ref:null, writing:false, pending:false, timer:null};

function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }

}
async function flushDb(){
  if (!store.ref) return;
  if (store.writing){ store.pending = true; return; }
  store.writing = true;
  try { await store.ref.set({json: JSON.stringify(state), updatedAt: new Date().toISOString()}); }
  catch(e){
    const code = e && e.code;
    if (code === 'unavailable'){ store.pending = true; }
    else if (code === 'quota_exceeded'){ toast('Seu espaço encheu. Apague itens antigos ou copie o backup.'); }
    else { store.ref = null; store.mode = 'local'; toast('Não deu para salvar na sua conta. Seus dados ficam neste navegador.'); }
  } finally {
    store.writing = false;
    if (store.pending && store.ref){ store.pending = false; setTimeout(flushDb, 1500 + Math.random() * 1500); }
  }
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), ms))]); }
async function initDb(){

    if (!id) return;

    const snap = await withTimeout(ref.get(), 10000);

function buildFicha(track){
  if (!track) return '';
  const t = today(), topics = topicsOf(track.id), sess = sessionsOf(track.id), notes = notesOf(track.id);
  const L = [];
  L.push('FICHA DO ALUNO (gerada pelo Tatame em ' + fmtFull(t) + ')');
  L.push('- Objetivo e prazo: ' + (track.goal || track.name) + (track.deadline ? ', até ' + fmtFull(track.deadline) : ''));
  if (track.minutes) L.push('- Tempo por dia: ' + track.minutes + ' minutos');
  L.push('- Sessões registradas: ' + sess.length + (sess.length ? ' (a última em ' + fmtFull(sess[sess.length - 1].date) + ')' : ''));
  if (topics.length){
    L.push('- Mapa (tópico | faixa | % na última checagem):');
    topics.forEach(tp => L.push('  ' + tp.name + ' | ' + BELTS[tp.belt].name + ' | ' + (tp.lastCheck != null ? tp.lastCheck + '%' : 'sem checagem')));
  }
  const changes = sess.filter(s => s.beltBefore !== s.beltAfter).slice(-5);
  if (changes.length){
    L.push('- Linha de aprendizado (mudanças de faixa):');
    changes.forEach(s => L.push('  ' + fmtFull(s.date) + ': ' + topicName(s.topicId) + ', ' + BELTS[s.beltBefore].name + ' → ' + BELTS[s.beltAfter].name));
  }
  const errs = notes.filter(n => n.type === 'erro' && !n.resolved);
  if (errs.length){
    L.push('- Erros em aberto (erro | correção):');
    errs.slice(-8).forEach(e => L.push('  ' + oneLine(e.text) + (e.right ? ' | ' + oneLine(e.right) : '')));
  }
  const sure = errs.filter(e => e.sure);
  if (sure.length){ L.push('- Onde eu tinha certeza e errei:'); sure.slice(-5).forEach(e => L.push('  ' + oneLine(e.text))); }
  const doubts = notes.filter(n => n.type === 'duvida' && !n.resolved);
  if (doubts.length){ L.push('- Dúvidas em aberto:'); doubts.slice(-8).forEach(n => L.push('  ' + topicName(n.topicId) + ': ' + oneLine(n.text))); }
  const rev = topics.filter(tp => tp.nextReview).sort((a, b) => a.nextReview < b.nextReview ? -1 : 1);
  if (rev.length){
    L.push('- Revisões agendadas (tópico | quando):');
    rev.forEach(tp => L.push('  ' + tp.name + ' | ' + reviewInfo(tp).text.toLowerCase() + ' (' + fmtFull(tp.nextReview) + ')'));
  }
  return L.join('\n');
}
function noteLine(n){
  if (n.type === 'erro') return '- Errei: ' + oneLine(n.text) + (n.why ? ' | Por quê: ' + oneLine(n.why) : '') + (n.right ? ' | O certo: ' + oneLine(n.right) : '') + (n.sure ? ' | eu tinha certeza' : '') + (n.resolved ? ' (resolvido)' : '');
  if (n.type === 'duvida') return '- ' + oneLine(n.text) + (n.resolved ? ' (resolvida)' : ' (em aberto)');
  return '- (' + fmtFull(n.date) + ') ' + (n.title ? oneLine(n.title) + ': ' : '') + oneLine(n.text);
}
function buildCaderno(track, opts){
  opts = opts || {};
  const topic = opts.topic || 'all', type = opts.type || 'all';
  let notes = notesOf(track.id).filter(n => (topic === 'all' || n.topicId === topic) && (type === 'all' || n.type === type));
  notes = notes.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  let used = [], size = 0, cut = false;
  for (const n of notes){ const l = noteLine(n).length + 1; if (size + l > CONTEXT_LIMIT){ cut = true; break; } used.push(n); size += l; }
  const L = ['MEU CADERNO DE ESTUDOS (Tatame, ' + fmtFull(today()) + ')',
    'Use isto como contexto do que eu já estudei. Não repita o que eu já domino; retome as dúvidas e os erros em aberto.',
    'Trilha: ' + track.name + (track.goal ? ' | Objetivo: ' + track.goal : '')];
  if (cut) L.push('(Mostrando só os itens mais recentes, para caber.)');
  const groups = topicsOf(track.id).map(tp => ({id:tp.id, tp:tp})).concat([{id:null, tp:null}]);
  groups.forEach(g => {
    const mine = used.filter(n => (n.topicId || null) === g.id);
    if (!mine.length) return;
    L.push('');
    L.push('## ' + (g.tp ? g.tp.name + ' (faixa ' + BELTS[g.tp.belt].name + ')' : 'Geral'));
    KIND_ORDER.forEach(k => {
      const items = mine.filter(n => n.type === k).sort((a, b) => a.date < b.date ? -1 : 1);
      if (!items.length) return;
      L.push(KINDS[k].many + ':');
      items.forEach(n => L.push(noteLine(n)));
    });
  });
  if (!used.length) L.push('', 'Ainda não tenho anotações aqui.');
  return L.join('\n');
}

  const track = activeTrack();

  const hasData = topicsOf(track.id).length > 0 || notesOf(track.id).length > 0 || !!track.ficha;
  if (!hasData){
    txt += 'Ainda não tenho ficha. Já adianto as respostas da entrevista:\n- O que eu quero aprender: ' + track.name + '\n';
    if (track.goal) txt += '- Para quê: ' + track.goal + '\n';
    if (track.deadline) txt += '- Prazo: ' + fmtFull(track.deadline) + '\n';
    if (track.minutes) txt += '- Tempo por dia: ' + track.minutes + ' minutos\n';

    if (learned.length) txt += '\n\nO que eu aprendi recentemente:\n' + learned.map(n => '- ' + topicName(n.topicId) + ': ' + (n.title ? oneLine(n.title) + '. ' : '') + oneLine(n.text)).join('\n');

  }
  if (tired) txt += '\n\nHoje estou exausto. Faça a sessão mínima de 15 minutos, só revisão.';
  return txt;
}

let toastTimer = null;
function toast(msg, kind){
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = 'toast'; }, 4500);
}
function copyText(text, okMsg){
  let p;
  try { p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject(); }
  catch(e){ p = Promise.reject(e); }
  p.then(() => toast(okMsg)).catch(() => {
    openDialog('<div class="form"><h2>Copie o texto</h2><p class="form-sub">O navegador bloqueou a cópia automática. Toque no texto, selecione tudo e copie.</p><div class="field"><label for="copyArea" class="sr">Texto para copiar</label><textarea id="copyArea" rows="12" readonly>' + esc(text) + '</textarea></div><div class="form-actions"><button type="button" class="btn btn-gold" data-action="close-dialog">Fechar</button></div></div>',
      d => { const ta = $('#copyArea', d); ta.focus(); ta.select(); });
  });
}
const dlg = $('#dlg');

  dlg.innerHTML = html;

function closeDialog(){ try { dlg.close(); } catch(e){ dlg.removeAttribute('open'); } dlg.innerHTML = ''; }

function armed(btn){
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = btn.dataset.confirm || 'Confirmar';

    d => {
      const sel = $('#f-topic', d), wrap = $('#f-new-wrap', d);
      sel.addEventListener('change', () => { wrap.hidden = sel.value !== '__new'; if (!wrap.hidden) $('#f-new', d).focus(); });
      $('#logForm', d).addEventListener('submit', e => { e.preventDefault(); saveLog(d); });

}
function saveLog(d){
  const track = activeTrack(); if (!track) return;
  const t = today();
  let date = $('#f-date', d).value || t; if (date > t) date = t;
  const raw = $('#f-check', d).value.trim();
  let check = null;
  if (raw !== ''){
    const n = Number(raw.replace(',', '.').replace('%', ''));
    if (!isFinite(n) || n < 0 || n > 100){ formError(d, 'A checagem precisa ser um número de 0 a 100.'); return; }
    check = Math.round(n);
  }
  let tp;
  const sel = $('#f-topic', d).value;
  if (sel === '__new'){
    const name = $('#f-new', d).value.trim();
    if (!name){ formError(d, 'Dê um nome para o novo tópico.'); $('#f-new', d).focus(); return; }
    tp = newTopic(track.id, name, 0, date); state.topics.push(tp);
  } else {
    tp = topicById(sel); if (!tp){ formError(d, 'Escolha um tópico.'); return; }
  }
  const kind = ($('input[name="f-kind"]:checked', d) || {}).value || 'novo';
  const r = applySession(tp, {date:date, kind:kind, check:check});
  const learned = $('#f-learned', d).value.trim(), doubt = $('#f-doubt', d).value.trim();
  state.sessions.push({id:uid(), trackId:track.id, topicId:tp.id, date:date, kind:kind, check:check, beltBefore:r.before, beltAfter:r.after, note:learned ? oneLine(learned).slice(0, 160) : ''});
  if (learned) state.notes.push(newNote(track.id, tp.id, 'aprendizado', {text:learned, date:date, updatedAt:t}));
  if (doubt) state.notes.push(newNote(track.id, tp.id, 'duvida', {text:doubt, date:date, updatedAt:t}));
  $$('.err-row', d).forEach(row => {
    const what = $('.er-what', row).value.trim(); if (!what) return;
    state.notes.push(newNote(track.id, tp.id, 'erro', {text:what, why:$('.er-why', row).value.trim(), right:$('.er-right', row).value.trim(), sure:$('.er-sure', row).checked, date:date, updatedAt:t}));
  });
  const ficha = $('#f-ficha', d).value.trim(); if (ficha) track.ficha = ficha;
  closeDialog(); commit();
  let msg;
  if (r.after > r.before) msg = tp.name + ' subiu para a faixa ' + BELTS[r.after].name + '.';
  else if (r.after < r.before) msg = tp.name + ' voltou para a faixa ' + BELTS[r.after].name + '. Bora reforçar.';
  else msg = 'Sessão salva.';
  toast(msg + ' ' + reviewInfo(tp).text + '.', r.after > r.before ? 'up' : '');
}

        const text = $('#n-text', d).value.trim(); if (!text){ formError(d, 'Escreva alguma coisa antes de guardar.'); return; }
        const f = {type:k, topicId:$('#n-topic', d).value || null, title:(k === 'erro' || k === 'duvida') ? '' : $('#n-title', d).value.trim(), text:text,
          why:k === 'erro' ? $('#n-why', d).value.trim() : '', right:k === 'erro' ? $('#n-right', d).value.trim() : '', sure:k === 'erro' && $('#n-sure', d).checked, updatedAt:today()};
        if (n) Object.assign(n, f); else state.notes.push(newNote(track.id, f.topicId, k, f));
        closeDialog(); commit(); toast(n ? 'Anotação salva.' : 'Guardado no caderno.');
      });
    });
}

function openNewTopic(){
  const track = activeTrack(); if (!track) return openNewTrack();
  openDialog('<form class="form" id="topicNew"><h2>Novo tópico</h2><p class="form-sub">' + esc(track.name) + '</p>' +
    '<div class="field"><label for="tn-name">Nome do tópico</label><input type="text" id="tn-name" maxlength="80" placeholder="Ex.: Funções"></div>' +
    '<div class="field"><label for="tn-belt">Faixa inicial</label><select id="tn-belt">' + beltOptions(0) + '</select><p class="hint">Use a faixa que o diagnóstico do professor indicou. Na dúvida, comece na Branca.</p></div>' +
    '<div class="form-actions"><button type="button" class="btn" data-action="close-dialog">Cancelar</button><button type="submit" class="btn btn-gold">Criar tópico</button></div></form>',
    d => {
      $('#tn-name', d).focus();
      $('#topicNew', d).addEventListener('submit', e => {
        e.preventDefault();
        const name = $('#tn-name', d).value.trim(); if (!name){ formError(d, 'Dê um nome para o tópico.'); return; }
        state.topics.push(newTopic(track.id, name, Number($('#tn-belt', d).value), today()));
        closeDialog(); commit(); toast('Tópico criado.');
      });
    });
}
function openTopic(id){
  const tp = topicById(id); if (!tp) return;
  const track = activeTrack();
  const hist = state.sessions.filter(s => s.topicId === id).slice().reverse().slice(0, 6);
  const notes = state.notes.filter(n => n.topicId === id).sort((a, b) => (a.updatedAt || a.date) < (b.updatedAt || b.date) ? 1 : -1).slice(0, 6);
  const r = reviewInfo(tp);
  openDialog('<form class="form" id="topicForm"><h2>' + esc(tp.name) + '</h2>' +
    '<div class="field">' + beltChip(tp.belt) + levelsLabeled(tp.belt) + '<p class="hint">' + BELTS[tp.belt].desc + '</p></div>' +
    '<dl class="facts"><div><dt>Última checagem</dt><dd>' + (tp.lastCheck != null ? tp.lastCheck + '%' : 'Nenhuma') + '</dd></div><div><dt>Próxima revisão</dt><dd>' + esc(r.text.replace('Revisão ', '').replace('Revisar ', '')) + '</dd></div><div><dt>Treinos na faixa</dt><dd>' + (tp.stripes || 0) + '</dd></div></dl>' +
    '<div class="sec"><div class="block-head"><h3>Caderno deste tópico</h3><span class="row"><button type="button" class="btn-text" data-action="copy-topic-caderno" data-id="' + tp.id + '">Copiar para a IA</button><button type="button" class="btn btn-sm" data-action="note-for-topic" data-id="' + tp.id + '">Nova anotação</button></span></div>' +
    (notes.length ? '<ul class="mini">' + notes.map(n => '<li><span class="k">' + KINDS[n.type].one + '</span>' + esc(n.title ? n.title + ': ' : '') + esc(oneLine(n.text).slice(0, 140)) + '</li>').join('') + '</ul>' : '<p class="empty">Nada anotado neste tópico ainda.</p>') + '</div>' +
    (hist.length ? '<div class="sec"><h3>Histórico</h3><ul class="mini">' + hist.map(s => '<li>' + esc(fmtShort(s.date)) + ', ' + kindLabel(s.kind).toLowerCase() + (s.check != null ? ', ' + s.check + '%' : '') + (s.beltBefore !== s.beltAfter ? ', ' + BELTS[s.beltBefore].name + ' → ' + BELTS[s.beltAfter].name : '') + '</li>').join('') + '</ul></div>' : '') +
    '<div class="sec"><div class="field"><label for="t-name">Nome do tópico</label><input type="text" id="t-name" maxlength="80" value="' + esc(tp.name) + '"></div>' +
    '<div class="field"><label for="t-belt">Ajustar faixa</label><select id="t-belt">' + beltOptions(tp.belt) + '</select><p class="hint">Use depois do diagnóstico. No dia a dia, as faixas mudam sozinhas pelas checagens.</p></div></div>' +
    '<div class="form-actions"><button type="button" class="btn-text danger" data-action="delete-topic" data-id="' + tp.id + '" data-confirm="Confirmar: apagar tópico">Apagar tópico</button><span class="spacer"></span>' +
    '<button type="button" class="btn" data-action="log-topic" data-id="' + tp.id + '">Registrar sessão</button><button type="submit" class="btn btn-gold">Salvar</button></div></form>',
    d => {
      $('#topicForm', d).addEventListener('submit', e => {
        e.preventDefault();
        const name = $('#t-name', d).value.trim(); if (!name){ formError(d, 'O tópico precisa de um nome.'); return; }
        tp.name = name;
        const nb = Number($('#t-belt', d).value);
        if (nb !== tp.belt){ tp.belt = nb; tp.beltSince = today(); tp.stripes = 0; }
        closeDialog(); commit(); toast('Tópico salvo.');
      });
    });
}
function trackFields(t){
  t = t || {};
  return '<div class="field"><label for="k-name">O que você quer aprender</label><input type="text" id="k-name" maxlength="60" placeholder="Ex.: Inglês para entrevistas" value="' + esc(t.name || '') + '"></div>' +
    '<div class="field"><label for="k-goal">Para quê</label><input type="text" id="k-goal" maxlength="120" placeholder="Ex.: Passar no concurso do TJ" value="' + esc(t.goal || '') + '"></div>' +
    '<div class="two"><div class="field"><label for="k-deadline">Prazo</label><input type="date" id="k-deadline" value="' + esc(t.deadline || '') + '"></div>' +
    '<div class="field"><label for="k-min">Minutos por dia</label><input type="number" id="k-min" inputmode="numeric" min="5" max="600" step="5" placeholder="Ex.: 40" value="' + esc(t.minutes || '') + '"></div></div>';
}
function readTrackFields(d){
  const m = Number($('#k-min', d).value);
  return {name:$('#k-name', d).value.trim(), goal:$('#k-goal', d).value.trim(), deadline:$('#k-deadline', d).value, minutes: m > 0 ? Math.round(m) : ''};
}
function openNewTrack(){
  openDialog('<form class="form" id="trackNew"><h2>Nova trilha</h2><p class="form-sub">Uma trilha é uma coisa que você quer aprender, com objetivo e prazo.</p>' + trackFields() +
    '<div class="form-actions"><button type="button" class="btn" data-action="close-dialog">Cancelar</button><button type="submit" class="btn btn-gold">Criar trilha</button></div></form>',
    d => {
      $('#k-name', d).focus();
      $('#trackNew', d).addEventListener('submit', e => {
        e.preventDefault();
        const f = readTrackFields(d); if (!f.name){ formError(d, 'Diga o que você quer aprender.'); return; }
        const t = Object.assign({id:uid(), ficha:'', example:false, createdAt:today()}, f);
        state.tracks.push(t); state.activeTrackId = t.id;
        closeDialog(); commit(); location.hash = 'hoje';
        toast('Trilha criada. Copie o prompt e comece pelo diagnóstico.');
      });
    });
}
function deleteTrack(id){
  state.tracks = state.tracks.filter(t => t.id !== id);
  state.topics = state.topics.filter(t => t.trackId !== id);
  state.sessions = state.sessions.filter(s => s.trackId !== id);
  state.notes = state.notes.filter(n => n.trackId !== id);
  if (state.activeTrackId === id) state.activeTrackId = state.tracks[0] ? state.tracks[0].id : null;
}
function openSettings(){
  const track = activeTrack();
  openDialog('<div class="form"><h2>Ajustes</h2>' +
    (track ? '<form class="field" id="trackEdit"><h3>Trilha atual</h3>' + trackFields(track) +
      '<div class="row"><button type="submit" class="btn btn-gold btn-sm">Salvar trilha</button><button type="button" class="btn-text danger" data-action="delete-track" data-confirm="Confirmar: apagar trilha">Apagar trilha</button></div></form>' : '') +
    '<section class="sec"><h3>Seus dados</h3><p class="store-note">' + esc(storeNote()) + '</p>' +
    '<div class="row"><button type="button" class="btn btn-sm" data-action="copy-backup">Copiar backup</button></div>' +
    '<div class="field"><label for="s-restore">Restaurar backup</label><textarea id="s-restore" rows="3" placeholder="Cole aqui o texto do backup"></textarea></div>' +
    '<div class="field"><label for="s-file">Ou escolha um arquivo de backup</label><input type="file" id="s-file" accept=".json,.txt,application/json,text/plain"></div>' +
    '<div class="row"><button type="button" class="btn btn-sm" data-action="restore">Restaurar</button><button type="button" class="btn-text danger" data-action="wipe" data-confirm="Confirmar: apagar tudo">Apagar todos os dados</button></div></section>' +
    '<div class="form-actions"><button type="button" class="btn" data-action="close-dialog">Fechar</button></div></div>',
    d => {
      const f = $('#trackEdit', d);
      if (f) f.addEventListener('submit', e => {
        e.preventDefault();
        const v = readTrackFields(d); if (!v.name){ toast('A trilha precisa de um nome.'); return; }
        Object.assign(track, v); closeDialog(); commit(); toast('Trilha salva.');
      });
      $('#s-file', d).addEventListener('change', ev => {
        const file = ev.target.files && ev.target.files[0]; if (!file) return;
        const rd = new FileReader(); rd.onload = () => { $('#s-restore', d).value = String(rd.result || ''); }; rd.readAsText(file);
      });
    });
}

/* ---------- Ações ---------- */
const actions = {
  'new-track': () => openNewTrack(),
  'settings': () => openSettings(),
  'copy-session': () => copyText(sessionText(false), 'Copiado. Cole na IA que você usa.'),
  'copy-tired': () => copyText(sessionText(true), 'Copiado. Hoje é sessão mínima de 15 minutos.'),
  'copy-prompt': () => copyText(PROMPT, 'Prompt copiado.'),
  'copy-ficha': () => copyText(buildFicha(activeTrack()), 'Ficha copiada.'),
  'copy-caderno': () => { const t = activeTrack(); copyText(buildCaderno(t, {topic:noteFilter.topic === 'none' ? 'all' : noteFilter.topic, type:noteFilter.type}), 'Caderno copiado. Cole na conversa com a IA.'); },
  'copy-topic-caderno': el => copyText(buildCaderno(activeTrack(), {topic:el.dataset.id}), 'Caderno do tópico copiado.'),
  'copy-backup': () => copyText(JSON.stringify(state), 'Backup copiado. Guarde num lugar seguro.'),
  'log': () => openLog(),
  'log-review': el => openLog({topicId:el.dataset.id, kind:'revisao'}),
  'log-topic': el => openLog({topicId:el.dataset.id, kind:'revisao'}),
  'open-topic': el => openTopic(el.dataset.id),
  'new-topic': () => openNewTopic(),
  'new-note': () => openNote(),
  'note-for-topic': el => openNote({topicId:el.dataset.id}),
  'edit-note': el => openNote({id:el.dataset.id}),
  'note-type': el => { noteFilter.type = el.dataset.type; render(); },
  'toggle-note': el => { const n = state.notes.find(x => x.id === el.dataset.id); if (n){ n.resolved = !n.resolved; commit(); toast(n.resolved ? (n.type === 'erro' ? 'Boa. Erro resolvido.' : 'Dúvida resolvida.') : 'Reaberto.'); } },
  'delete-note': el => { if (!armed(el)) return; state.notes = state.notes.filter(x => x.id !== el.dataset.id); commit(); toast('Apagado do caderno.'); },
  'add-error-row': () => { const box = $('#f-errors'); if (box){ box.insertAdjacentHTML('beforeend', errorRowHTML()); const last = $$('.er-what', box).pop(); if (last) last.focus(); } },
  'remove-error-row': el => { const r = el.closest('.err-row'); if (r) r.remove(); },
  'close-dialog': () => closeDialog(),
  'delete-topic': el => {
    if (!armed(el)) return;
    const id = el.dataset.id;
    state.topics = state.topics.filter(t => t.id !== id);
    state.sessions = state.sessions.filter(s => s.topicId !== id);
    state.notes.forEach(n => { if (n.topicId === id) n.topicId = null; });
    closeDialog(); commit(); toast('Tópico apagado. As anotações dele foram para Geral.');
  },
  'delete-example': () => { const ex = state.tracks.find(t => t.example); if (ex){ deleteTrack(ex.id); commit(); toast('Exemplo apagado.'); } },
  'delete-track': el => { if (!armed(el)) return; const t = activeTrack(); if (t){ deleteTrack(t.id); closeDialog(); commit(); toast('Trilha apagada.'); } },
  'restore': () => {
    const raw = ($('#s-restore') || {}).value || '';
    let n = null; try { n = normalize(JSON.parse(raw)); } catch(e){ n = null; }
    if (!n){ toast('Esse texto não é um backup do Tatame. Confira se copiou ele inteiro.'); return; }
    state = n; closeDialog(); commit(); toast('Backup restaurado.');
  },
  'wipe': el => { if (!armed(el)) return; state = blankState(); closeDialog(); commit(); toast('Tudo apagado.'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'trackSelect'){
    if (e.target.value === '__new'){ renderTrackSelect(); openNewTrack(); return; }
    if (!e.target.value) return;
    state.activeTrackId = e.target.value; noteFilter.topic = 'all'; commit();
  } else if (e.target.id === 'noteTopic'){ noteFilter.topic = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'noteSearch'){ noteFilter.q = e.target.value; const t = activeTrack(); const box = $('#noteList'); if (t && box) box.innerHTML = noteListHTML(t); }
});
function viewFromHash(){ let h = (location.hash || '').replace('#', ''); if (h === 'erros') h = 'caderno'; return VIEWS.indexOf(h) >= 0 ? h : 'hoje'; }
window.addEventListener('hashchange', () => { view = viewFromHash(); render(); window.scrollTo(0, 0); });

/* ---------- Início ---------- */
const local = loadLocal();
state = (local && normalize(local)) || seedState();
view = viewFromHash();
render();
if (window.claude && typeof window.claude.use === 'function') initDb();
else setTimeout(() => { if (window.claude && typeof window.claude.use === 'function') initDb(); }, 1500);
})();
</script>
</body>
</html>
